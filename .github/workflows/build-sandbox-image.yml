name: Build sandbox image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push under registry.cloudflare.com/<acct>/shiba-ai-coworker-sandbox-dogfood
        required: true
        default: boot

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and push sandbox image to Cloudflare registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4.118.0 containers build -p \
            -t "shiba-ai-coworker-sandbox-dogfood:${{ inputs.tag }}" \
            apps/backend
