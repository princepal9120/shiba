name: Build sandbox image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push under registry.cloudflare.com/<acct>/shiba-ai-coworker-sandbox-dogfood
        required: true
        default: boot

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and push sandbox image to Cloudflare registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4.118.0 containers build -p \
            -t "shiba-ai-coworker-sandbox-dogfood:${{ inputs.tag }}" \
            apps/backend
