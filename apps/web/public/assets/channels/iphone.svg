<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 24 24" fill="currentColor">
  <title>iPhone</title>
  <!--
    Filled device glyph matching the channel-icon family (Slack, Telegram,
    Discord). Reads as an iPhone at icon scale via three signature cues:
    the slab with deeply rounded corners, the centered Dynamic Island with
    camera cutout, and the bottom home-indicator bar.
  -->
  <!-- Side buttons first so the body covers their inner edge. -->
  <rect x="4.35" y="6.8" width="0.85" height="1.7" rx="0.4"/>
  <rect x="4.35" y="9.4" width="0.85" height="2.9" rx="0.4"/>
  <rect x="18.8" y="8.6" width="0.85" height="3.6" rx="0.4"/>
  <!-- Body: outer slab minus the inset screen (evenodd cutout). -->
  <path fill-rule="evenodd" d="M8.6 1.2h6.8a3.4 3.4 0 0 1 3.4 3.4v14.8a3.4 3.4 0 0 1-3.4 3.4H8.6a3.4 3.4 0 0 1-3.4-3.4V4.6A3.4 3.4 0 0 1 8.6 1.2Zm.1 1.1h6.6a2.4 2.4 0 0 1 2.4 2.4v14.6a2.4 2.4 0 0 1-2.4 2.4H8.7a2.4 2.4 0 0 1-2.4-2.4V4.7a2.4 2.4 0 0 1 2.4-2.4Z"/>
  <!-- Dynamic Island pill with camera dot cut out. -->
  <path fill-rule="evenodd" d="M10.05 3.05h3.9a0.75 0.75 0 0 1 0 1.5h-3.9a0.75 0.75 0 0 1 0-1.5Zm3.3 0.45a0.3 0.3 0 1 1 0 0.6 0.3 0.3 0 0 1 0-0.6Z"/>
  <!-- Home indicator bar. -->
  <rect x="10.1" y="20.5" width="3.8" height="0.8" rx="0.4"/>
</svg>
