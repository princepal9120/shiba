<svg width="250" height="250" viewBox="0 0 250 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circleClip">
      <circle cx="125" cy="125" r="111" />
    </clipPath>
    <style>
      @keyframes animShadesCircle {
        0%, 72% { opacity: 1; visibility: visible; }
        73%, 98% { opacity: 0; visibility: hidden; }
        99%, 100% { opacity: 1; visibility: visible; }
      }
      @keyframes animSquintCircle {
        0%, 72% { opacity: 0; visibility: hidden; }
        73%, 85% { opacity: 1; visibility: visible; }
        86%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes animWinkCircle {
        0%, 85% { opacity: 0; visibility: hidden; }
        86%, 98% { opacity: 1; visibility: visible; }
        99%, 100% { opacity: 0; visibility: hidden; }
      }
      .circle-frame-1 {
        animation: animShadesCircle 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .circle-frame-2 {
        animation: animSquintCircle 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .circle-frame-3 {
        animation: animWinkCircle 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      svg:hover .circle-frame-1 {
        animation: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
      svg:hover .circle-frame-2 {
        animation: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
      svg:hover .circle-frame-3 {
        animation: none !important;
        opacity: 1 !important;
        visibility: visible !important;
      }
    </style>
  </defs>

  <!-- Outer Circular Comic Frame with Ink Outline -->
  <circle cx="125" cy="125" r="116" fill="#0B9F95" stroke="#0B0B0B" stroke-width="9"/>

  <g clip-path="url(#circleClip)">
    <!-- Inner Background Tint -->
    <rect width="250" height="250" fill="#0B9F95" />

    <!-- Shiba Doge Head (Angled 12 degrees like the card in Image #1) -->
    <g transform="translate(125, 130) rotate(-10) translate(-125, -130)">
      
      <!-- Left Ear -->
      <path d="M 68 85 L 42 30 Q 82 40 92 80 Z" fill="#D97706" stroke="#0B0B0B" stroke-width="7" stroke-linejoin="round"/>
      <path d="M 64 74 L 50 44 Q 74 50 78 70 Z" fill="#FDE68A"/>
      <!-- Ear ink hatch shading -->
      <line x1="58" y1="52" x2="68" y2="62" stroke="#0B0B0B" stroke-width="3" stroke-linecap="round"/>
      <line x1="62" y1="58" x2="72" y2="68" stroke="#0B0B0B" stroke-width="3" stroke-linecap="round"/>

      <!-- Right Ear -->
      <path d="M 182 85 L 208 30 Q 168 40 158 80 Z" fill="#D97706" stroke="#0B0B0B" stroke-width="7" stroke-linejoin="round"/>
      <path d="M 186 74 L 200 44 Q 176 50 172 70 Z" fill="#FDE68A"/>
      <!-- Right Ear ink hatch shading -->
      <line x1="192" y1="52" x2="182" y2="62" stroke="#0B0B0B" stroke-width="3" stroke-linecap="round"/>
      <line x1="188" y1="58" x2="178" y2="68" stroke="#0B0B0B" stroke-width="3" stroke-linecap="round"/>

      <!-- Head Base -->
      <ellipse cx="125" cy="135" rx="86" ry="76" fill="#E89B3D" stroke="#0B0B0B" stroke-width="8"/>

      <!-- White Cheek Fluff & Muzzle -->
      <path d="M 55 140 Q 40 166 70 182 Q 100 192 125 192 Q 150 192 180 182 Q 210 166 195 140 Q 170 124 125 124 Q 80 124 55 140 Z" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="7"/>

      <!-- Cute Black Nose -->
      <ellipse cx="125" cy="154" rx="12" ry="8" fill="#0B0B0B"/>
      <!-- Smile line -->
      <path d="M 115 162 Q 125 170 135 162" stroke="#0B0B0B" stroke-width="5" stroke-linecap="round" fill="none"/>

      <!-- FRAME 1: Cool Blue Mirrored Sunglasses -->
      <g class="circle-frame-1">
        <!-- Left Lens -->
        <rect x="72" y="100" width="46" height="34" rx="8" fill="#06B6D4" stroke="#0B0B0B" stroke-width="7"/>
        <!-- Right Lens -->
        <rect x="132" y="100" width="46" height="34" rx="8" fill="#06B6D4" stroke="#0B0B0B" stroke-width="7"/>
        <!-- Bridge -->
        <line x1="118" y1="112" x2="132" y2="112" stroke="#0B0B0B" stroke-width="7" stroke-linecap="round"/>
        <!-- White Glare Lines on Glasses -->
        <line x1="82" y1="106" x2="90" y2="124" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
        <line x1="142" y1="106" x2="150" y2="124" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- FRAME 2: Happy Squint Eyes with Blush (^ _ ^) -->
      <g class="circle-frame-2" opacity="0">
        <path d="M 76 116 Q 95 102 114 116" stroke="#0B0B0B" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M 136 116 Q 155 102 174 116" stroke="#0B0B0B" stroke-width="8" stroke-linecap="round" fill="none"/>
        <ellipse cx="66" cy="132" rx="10" ry="5" fill="#F43F5E" opacity="0.85"/>
        <ellipse cx="184" cy="132" rx="10" ry="5" fill="#F43F5E" opacity="0.85"/>
      </g>

      <!-- FRAME 3: Playful Wink with Star Sparkle -->
      <g class="circle-frame-3" opacity="0">
        <!-- Left Eye Winking -->
        <path d="M 76 116 Q 95 124 114 116" stroke="#0B0B0B" stroke-width="8" stroke-linecap="round" fill="none"/>
        <!-- Right Eye Sunglasses -->
        <rect x="132" y="100" width="46" height="34" rx="8" fill="#06B6D4" stroke="#0B0B0B" stroke-width="7"/>
        <line x1="118" y1="112" x2="132" y2="112" stroke="#0B0B0B" stroke-width="7" stroke-linecap="round"/>
        <line x1="142" y1="106" x2="150" y2="124" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
        <!-- Star Sparkle on left cheek -->
        <path d="M 68 100 L 73 88 L 78 100 L 90 105 L 78 110 L 73 122 L 68 110 L 56 105 Z" fill="#FACC15" stroke="#0B0B0B" stroke-width="3"/>
        <ellipse cx="66" cy="132" rx="10" ry="5" fill="#F43F5E" opacity="0.85"/>
        <ellipse cx="184" cy="132" rx="10" ry="5" fill="#F43F5E" opacity="0.85"/>
      </g>

      <!-- Hand-Drawn Manga Hatch Marks (Shadows like Image #1) -->
      <line x1="90" y1="188" x2="98" y2="204" stroke="#0B0B0B" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="102" y1="190" x2="110" y2="206" stroke="#0B0B0B" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="114" y1="192" x2="122" y2="208" stroke="#0B0B0B" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="126" y1="192" x2="134" y2="208" stroke="#0B0B0B" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="138" y1="190" x2="146" y2="206" stroke="#0B0B0B" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="150" y1="188" x2="158" y2="204" stroke="#0B0B0B" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Gold Star Accent Sparkle -->
      <path d="M 60 90 L 65 78 L 70 90 L 82 95 L 70 100 L 65 112 L 60 100 L 48 95 Z" fill="#FACC15" stroke="#0B0B0B" stroke-width="3"/>

    </g>
  </g>
</svg>
