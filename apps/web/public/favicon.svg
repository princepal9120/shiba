<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="44" height="44" fill="none" class="shiba-mascot-svg">
  <defs>
    <clipPath id="shibaHeadClip">
      <circle cx="50" cy="50" r="48" />
    </clipPath>
    <linearGradient id="shibaTealGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0B9F95" />
    </linearGradient>
    <style>
      @keyframes animShades {
        0%, 72% { opacity: 1; visibility: visible; }
        73%, 98% { opacity: 0; visibility: hidden; }
        99%, 100% { opacity: 1; visibility: visible; }
      }
      @keyframes animSquint {
        0%, 72% { opacity: 0; visibility: hidden; }
        73%, 85% { opacity: 1; visibility: visible; }
        86%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes animWink {
        0%, 85% { opacity: 0; visibility: hidden; }
        86%, 98% { opacity: 1; visibility: visible; }
        99%, 100% { opacity: 0; visibility: hidden; }
      }
      #shiba-frame-1, .shiba-frame-1 {
        animation: animShades 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      #shiba-frame-2, .shiba-frame-2 {
        animation: animSquint 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      #shiba-frame-3, .shiba-frame-3 {
        animation: animWink 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      svg:hover #shiba-frame-1, svg:hover .shiba-frame-1 {
        animation: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
      svg:hover #shiba-frame-2, svg:hover .shiba-frame-2 {
        animation: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
      svg:hover #shiba-frame-3, svg:hover .shiba-frame-3 {
        animation: none !important;
        opacity: 1 !important;
        visibility: visible !important;
      }
    </style>
  </defs>

  <!-- Outer Ring Neo-Brutalist Border -->
  <circle cx="50" cy="50" r="47" fill="url(#shibaTealGrad)" stroke="#000000" stroke-width="3" />

  <!-- Ears with black manga outlines -->
  <path d="M 28 34 L 18 12 Q 34 16 38 32 Z" fill="#D97706" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
  <path d="M 26 29 L 21 17 Q 31 20 33 28 Z" fill="#FDE68A" />
  
  <path d="M 72 34 L 82 12 Q 66 16 62 32 Z" fill="#D97706" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
  <path d="M 74 29 L 79 17 Q 69 20 67 28 Z" fill="#FDE68A" />

  <!-- Head Base -->
  <ellipse cx="50" cy="54" rx="34" ry="30" fill="#E89B3D" stroke="#000000" stroke-width="3" />

  <!-- White Cheek Fluffs & Muzzle -->
  <path d="M 22 56 Q 16 66 28 72 Q 40 76 50 76 Q 60 76 72 72 Q 84 66 78 56 Q 68 50 50 50 Q 32 50 22 56 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
  
  <!-- Cute Black Nose -->
  <ellipse cx="50" cy="61" rx="4.5" ry="3" fill="#000000" />
  <!-- Smiling Mouth Line -->
  <path d="M 46 64 Q 50 67 54 64" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- EYE ANIMATION FRAMES -->
  
  <!-- Frame 1: Cool Blue Mirror Sunglasses (Default Active) -->
  <g id="shiba-frame-1" class="shiba-frame-1">
    <rect x="29" y="40" width="18" height="13" rx="3.5" fill="#06B6D4" stroke="#000000" stroke-width="2.5" />
    <rect x="53" y="40" width="18" height="13" rx="3.5" fill="#06B6D4" stroke="#000000" stroke-width="2.5" />
    <line x1="47" y1="45" x2="53" y2="45" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
    <!-- White Glare Highlights on Shades -->
    <line x1="33" y1="43" x2="36" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="57" y1="43" x2="60" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Frame 2: Happy Blinking Squint Eyes (^ _ ^) -->
  <g id="shiba-frame-2" class="shiba-frame-2">
    <path d="M 31 46 Q 38 40 45 46" stroke="#000000" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 55 46 Q 62 40 69 46" stroke="#000000" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Anime Blush Cheeks -->
    <ellipse cx="26" cy="53" rx="4" ry="2" fill="#F43F5E" opacity="0.85" />
    <ellipse cx="74" cy="53" rx="4" ry="2" fill="#F43F5E" opacity="0.85" />
  </g>

  <!-- Frame 3: Playful Wink with Star Sparkle -->
  <g id="shiba-frame-3" class="shiba-frame-3">
    <!-- Left Eye Winking Line -->
    <path d="M 31 46 Q 38 49 45 46" stroke="#000000" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Right Eye Open with Sunglasses and Star -->
    <rect x="53" y="40" width="18" height="13" rx="3.5" fill="#06B6D4" stroke="#000000" stroke-width="2.5" />
    <line x1="47" y1="45" x2="53" y2="45" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
    <line x1="57" y1="43" x2="60" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <!-- Star Sparkle on left cheek -->
    <path d="M 28 40 L 30 35 L 32 40 L 37 42 L 32 44 L 30 49 L 28 44 L 23 42 Z" fill="#FACC15" />
    <ellipse cx="26" cy="53" rx="4" ry="2" fill="#F43F5E" opacity="0.85" />
    <ellipse cx="74" cy="53" rx="4" ry="2" fill="#F43F5E" opacity="0.85" />
  </g>
</svg>
