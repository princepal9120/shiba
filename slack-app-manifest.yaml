# Slack app manifest — create the app at https://api.slack.com/apps?new_app=1
# and choose "From a manifest". Replace YOUR-WORKER with your deployed host
# (e.g. shiba-ai-coworker.you.workers.dev) before importing.
display_information:
  name: shiba-ai-coworker
  description: Approval-gated AI software engineer in your own Cloudflare account
  background_color: "#0b0d10"
features:
  bot_user:
    display_name: shiba-ai-coworker
    always_online: true
  slash_commands:
    - command: /shiba-ai-coworker
      url: https://YOUR-WORKER.workers.dev/api/slack/command
      description: Queue a coding task for approval
      usage_hint: "https://github.com/owner/repo <task>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - channels:history
      - groups:history
      - im:history
      - mpim:history
settings:
  event_subscriptions:
    request_url: https://YOUR-WORKER.workers.dev/api/slack/events
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
    request_url: https://YOUR-WORKER.workers.dev/api/slack/interact
  org_deploy_enabled: false
